syntax = "proto3";

package api.v1.container;
option go_package = "github.com/amadeusitgroup/cds/cdspb";

// RebuildContainerRequest identifies the container to rebuild.
message RebuildContainerRequest {
  // container_name is the target container identifier.
  string container_name = 1;

  // override_image_tag optionally replaces the tag of the devcontainer image
  // for this rebuild; empty means the tag declared by the configuration.
  string override_image_tag = 2;
}

