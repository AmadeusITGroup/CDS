syntax = "proto3";

package api.v1.container;
option go_package = "github.com/amadeusitgroup/cds/cdspb";

// DeleteContainerRequest identifies the container to delete.
message DeleteContainerRequest {
  // container_name is the target container identifier.
  string container_name = 1;

  // project_name scopes CDS-managed cached state to remove after deletion.
  string project_name = 2;
}
