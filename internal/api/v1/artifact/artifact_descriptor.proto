syntax = "proto3";

package api.v1.artifact;
option go_package = "github.com/amadeusitgroup/cds/cdspb";

// ArtifactDescriptor describes one staged deploy artifact.
message ArtifactDescriptor {
  // type identifies the uploaded data content type.
  // Examples: "text/plain", "application/json".
  string type = 1;

  // digest is the optional sha256:<hex> content digest used to verify integrity.
  string digest = 2;

  // size is the artifact byte size when known.
  int64 size = 3;

  // identifier identifies which deploy input binding this artifact satisfies.
  // It is derived from CDS resource analysis, for example
  // "resource/auth/auth" or "resource/dockerfile/Dockerfile".
  string identifier = 4;
}
